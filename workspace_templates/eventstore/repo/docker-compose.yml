# Services for the eventstore exercise.
#
# Host ports come from the adjacent .env, which the harness generates with a port
# allocated from 55000-55999. Compose substitutes ${WS_MONGO_PORT} natively, so no
# templating step is needed and this file is directly runnable by an author.
#
# Note that only the PUBLISHED port moves. Inside this network the app still reaches
# MongoDB at db:27017, so the application's own configuration looks exactly as it would
# in production.
#
# There is no service for DuckDB. DuckDB is a library and the warehouse is a file under
# warehouse/, which is why this stack has two containers rather than three.

services:
  db:
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-eventstore}
    ports:
      - "${WS_MONGO_PORT:-55017}:27017"
    volumes:
      - mongodata:/data/db
      # Anything in here runs once, on first boot of an empty volume.
      - ./seed:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Without this, `docker compose up -d --wait` returns while mongod is still
      # starting and the first connection from the app fails.
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30

  app:
    build: .
    image: aiprep-eventstore:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      # db:27017 rather than the published port: this is container-to-container.
      MONGO_URL: mongodb://db:27017
      MONGO_DATABASE: ${MONGO_DATABASE:-eventstore}
      EVENTSTORE_ROOT: /app
      PYTHONPATH: /app/src
    volumes:
      # Bind-mounted so edits in your own editor take effect without a rebuild.
      - .:/app
    ports:
      - "${WS_APP_PORT:-55800}:8000"
    # Keeps the container alive for `docker compose exec` even if uvicorn exits.
    command:
      - sh
      - -c
      - "uvicorn eventstore.api:app --host 0.0.0.0 --port 8000 || sleep infinity"

volumes:
  mongodata:
