[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eventstore"
version = "0.4.0"
description = "Request-event ingestion on MongoDB with a DuckDB performance model"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "pydantic>=2.6,<3",
    "pymongo>=4.6,<5",
    "duckdb>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "httpx>=0.27,<1"]

[project.scripts]
eventstore = "eventstore.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -ra"
markers = [
    # Tests that need the Mongo service. Everything in perfmodel/ is marked with
    # neither, because a statistic should be testable without a database.
    "mongo: requires a running MongoDB",
    "perf: measures work done rather than correctness",
]
