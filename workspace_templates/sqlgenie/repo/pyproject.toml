[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlgenie"
version = "0.6.0"
description = "Natural-language questions answered against multi-tenant Postgres"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "pydantic>=2.6,<3",
    "psycopg[binary]>=3.1,<4",
    "sqlglot>=25.0,<31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "httpx>=0.27,<1"]

[project.scripts]
sqlgenie = "sqlgenie.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -ra"
markers = [
    # Needs a running PostgreSQL. The policy and cassette tests carry neither marker,
    # because a security rewrite should be testable without a database.
    "db: requires PostgreSQL",
    # The cross-tenant suite. Separated so CI can run it as its own step and a failure
    # reads as "isolation broke" rather than as one red dot among hundreds.
    "security: asserts tenant isolation",
]
