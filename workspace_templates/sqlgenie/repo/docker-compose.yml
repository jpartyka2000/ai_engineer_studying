# Services for the sqlgenie exercise.
#
# Host ports come from the adjacent .env, which the harness generates with a port
# allocated from 55000-55999. Compose substitutes ${WS_POSTGRES_PORT} natively, so no
# templating step is needed and this file is directly runnable by an author.
#
# Note that only the PUBLISHED port moves. Inside this network the app still reaches
# PostgreSQL at db:5432, so the application's own configuration -- including the two
# separate roles it connects as -- looks exactly as it would in production.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sqlgenie}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${WS_POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Without this, `docker compose up -d --wait` returns while Postgres is still
      # starting and the first migration fails on a closed socket.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sqlgenie}"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    image: aiprep-sqlgenie:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Two URLs, two roles. The application answers questions as sqlgenie_app, which
      # owns nothing and is therefore subject to the row-level security policies;
      # migrations and the API-key lookup run as the owner. See db/pool.py.
      DATABASE_URL: postgresql://sqlgenie_app:app@db:5432/${POSTGRES_DB:-sqlgenie}
      MIGRATION_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-sqlgenie}
      SQLGENIE_ROOT: /app
      PYTHONPATH: /app/src
    volumes:
      # Bind-mounted so edits in your own editor take effect without a rebuild.
      - .:/app
    ports:
      - "${WS_APP_PORT:-55800}:8000"
    # Keeps the container alive for `docker compose exec` even if uvicorn exits.
    command:
      - sh
      - -c
      - "uvicorn sqlgenie.api:app --host 0.0.0.0 --port 8000 || sleep infinity"

volumes:
  pgdata:
