# CI for ragqa.
#
# ci/run_ci.sh is the executable mirror of this file. There is no GitHub runner available
# in the exercise environment, so this workflow is the artifact you read and edit while
# the script is what actually runs. The two must stay in step: a fix applied to only one
# of them is an incomplete fix.

name: ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  TZ: UTC
  PYTHONHASHSEED: random
  CI: "true"
  RAGQA_ROOT: ${{ github.workspace }}
  DATABASE_URL: postgresql://ragqa:ragqa@localhost:5432/ragqa

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ragqa
          POSTGRES_USER: ragqa
          POSTGRES_PASSWORD: ragqa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ragqa -d ragqa"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --no-deps -e .

      - name: Import smoke test
        run: python -c "import ragqa; print('ragqa', ragqa.__version__)"

      - name: Retrieval, generation and scoring run with no database and no network
        env:
          DATABASE_URL: postgresql://nobody@127.0.0.1:1/nothing
          HTTP_PROXY: http://127.0.0.1:1
          HTTPS_PROXY: http://127.0.0.1:1
        run: python -m pytest -p no:cacheprovider -q -m "not db"

      - name: Apply migrations
        run: ragqa migrate

      - name: Run the full test suite
        run: python -m pytest -p no:cacheprovider -q

      - name: Index shape
        run: ragqa index

      - name: Score the labelled evaluation set
        run: |
          ragqa --json eval > eval-report.json
          python - <<'PY'
          import json, sys
          report = json.load(open("eval-report.json"))
          print(json.dumps(report, indent=2, sort_keys=True))
          required = ("exact_match", "token_f1", "citation_precision",
                      "citation_recall", "refusal_balanced_accuracy")
          below = {n: report[n] for n in required if report[n] < 1.0}
          if below:
              print(f"metrics below baseline: {below}", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Answer one question end to end
        run: ragqa ask "How long is probation?"
