# etlduck needs no database service: DuckDB is in-process and the warehouse is a file.
# The single container exists so the suite, the CLI and the benchmark all run in the same
# pinned interpreter the grading harness uses.

services:
  app:
    build: .
    image: aiprep-etlduck:latest
    environment:
      ETLDUCK_ROOT: /app
      PYTHONPATH: /app/src
    volumes:
      # Bind-mounted so edits in your own editor take effect without a rebuild.
      - .:/app
    # No healthcheck probing a port, because nothing listens. `docker compose up --wait`
    # is satisfied once the container is running.
    command: ["sleep", "infinity"]
