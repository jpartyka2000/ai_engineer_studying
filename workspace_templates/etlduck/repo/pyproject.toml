[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etlduck"
version = "0.3.0"
description = "A medallion warehouse on DuckDB: raw -> bronze -> silver -> gold"
requires-python = ">=3.12"
dependencies = ["duckdb>=1.1,<2", "PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]

[project.scripts]
etlduck = "etlduck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -ra"
markers = [
    "slow: marks slow tests",
]
