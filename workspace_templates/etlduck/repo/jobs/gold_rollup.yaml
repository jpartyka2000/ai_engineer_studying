# Gold rollup and the quality gates.
#
# `run` rather than `gold` on purpose: the gates have to execute in the same task that
# advances the watermark, because the watermark may only move over data that passed them.
# Splitting them into two tasks is how a bad batch gets marked as done.
name: etlduck-gold-rollup
schedule:
  quartz_cron_expression: "0 45 * * * ?"
  timezone_id: UTC
  pause_status: PAUSED
max_concurrent_runs: 1
tasks:
  - task_key: rollup_and_validate
    description: >
      Rebuild gold from silver, run every data-quality gate, and advance the usage watermark
      only if they all pass. Exits non-zero when any gate fails.
    python_file: src/etlduck/cli.py
    parameters: ["run"]
    depends_on:
      - task_key: build_silver
    # No retries. A failed gate means the data is wrong, and running it again will reach the
    # same conclusion more slowly.
    max_retries: 0
    timeout_seconds: 3600
email_notifications:
  on_failure: ["data-platform@example.com", "finance-eng@example.com"]
