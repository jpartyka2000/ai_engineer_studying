# edakit needs no database: it is a library over CSV files. The single service exists
# so tests run in a pinned interpreter with the package installed.

services:
  app:
    build: .
    image: aiprep-edakit:latest
    volumes:
      # Bind-mounted so edits in your own editor take effect immediately.
      - .:/app
    working_dir: /app
    command: ["sleep", "infinity"]
    healthcheck:
      test: ["CMD", "python", "-c", "import edakit; print(edakit.__version__)"]
      interval: 2s
      timeout: 5s
      retries: 15
