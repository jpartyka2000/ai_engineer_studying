[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edakit"
version = "0.4.0"
description = "Exploratory data analysis and preprocessing for tabular data."
requires-python = ">=3.12"
# Deliberately empty. The standard library is enough, and staying dependency-free is
# what lets this be dropped into any environment without negotiation.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]

[project.scripts]
edakit = "edakit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -ra --doctest-modules --doctest-glob=*.md"
markers = [
    "slow: marks slow tests",
]
