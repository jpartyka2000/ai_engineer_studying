# CI for edakit. Keep in step with ci/run_ci.sh.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TZ: UTC
      PYTHONHASHSEED: random
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install --no-deps .
      - name: Import smoke test
        run: python -c "import edakit; print(edakit.__version__)"
      - name: Test suite
        run: python -m pytest -p no:cacheprovider -q
      - name: Docstring examples
        run: python -m pytest -p no:cacheprovider -q --doctest-modules src/edakit
      - name: CLI smoke test
        run: |
          edakit profile datasets/tiny.csv > /dev/null
          edakit missing datasets/customers.csv --threshold 0.2 > /dev/null
      - name: Profiling benchmark
        run: python bench/bench_profile.py --json > /dev/null
