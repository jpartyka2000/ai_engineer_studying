# Ruff configuration for AI Interview Prep.
#
# Kept in a dedicated file rather than pyproject.toml, matching how pytest.ini is
# handled, and so nothing here can affect packaging.
#
# line-length is 100 because that is what the codebase already writes. Ruff's
# default of 88 disagreed with 56 existing files, which made the
# "ruff format ." step in CLAUDE.md impossible to follow.

line-length = 100
target-version = "py312"

exclude = [
    ".git",
    ".ruff_cache",
    "venv",
    "staticfiles",
    "media",
    # Scaffolded exercise repositories. These are throwaway working copies of the
    # templates below, created at runtime.
    "workspaces",
    # Exercise templates for workspace mode. These are deliberately broken
    # application code -- an injected defect is the whole point -- so linting them
    # as part of this project would report the exercises as errors.
    "workspace_templates",
    # Study-note source content. Despite the .py extension these files hold
    # markdown prose, not Python, so they are not lintable as source.
    "llm_studying",
]

[lint]
# Ruff's default rule set: pycodestyle errors (E4/E7/E9) and pyflakes (F).
# Line length is enforced by the formatter rather than by E501, so that long
# URLs and prose in docstrings are not flagged.
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Django migrations are generated; their long lines and import style are not ours.
"**/migrations/*.py" = ["E501"]
# Tests reach into private helpers deliberately when testing internals.
"tests/**/*.py" = ["E402"]

[format]
docstring-code-format = true
