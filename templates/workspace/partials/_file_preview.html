{% comment %}One file, read-only. The path was validated by paths.safe_join.{% endcomment %}
<div class="border-t pt-3">
  <p class="text-xs font-mono text-gray-500 mb-2">{{ path }} <span class="text-gray-400">({{ size }} bytes)</span></p>
  {% if binary %}
    <p class="text-xs text-gray-500">Binary file, not shown.</p>
  {% else %}
    <pre class="code-block text-xs max-h-64 overflow-auto"><code>{{ content }}</code></pre>
    {% if truncated %}<p class="text-xs text-amber-700 mt-1">Truncated for display.</p>{% endif %}
  {% endif %}
</div>
