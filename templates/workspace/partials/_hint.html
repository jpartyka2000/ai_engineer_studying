{% comment %}One revealed hint, appended to #ws-hints by HTMX.{% endcomment %}
<div class="rounded-md bg-amber-50 border border-amber-200 p-3 text-sm text-amber-900">
  <span class="font-medium">Hint {{ index }}:</span> {{ hint }}
</div>
{% if not has_more %}
<p class="text-xs text-gray-500">That was the last hint.</p>
{% endif %}
